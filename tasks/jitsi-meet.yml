---
- name: Set debconf options for jitsi-meet
  ansible.builtin.debconf:
    name: "{{ item.name }}"
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: "{{ item.vtype }}"
  loop:
    - name: jitsi-videobridge2
      question: jitsi-videobridge/jvb-hostname
      value: "{{ jitsi_meet_server_name }}"
      vtype: string
    - name: jitsi-meet-web-config
      question: jitsi-meet/cert-choice
      value: "{{ jitsi_meet_cert_choice }}"
      vtype: string
    - name: jitsi-meet-web-config
      question: jitsi-meet/cert-path-crt
      value: "{{ jitsi_meet_ssl_cert_path }}"
      vtype: string
    - name: jitsi-meet-web-config
      question: jitsi-meet/cert-path-key
      value: "{{ jitsi_meet_ssl_key_path }}"
      vtype: string
    - name: jitsi-meet-prosody
      question: jitsi-meet-prosody/turn-secret
      value: "{{ jitsi_meet_turn_secret }}"
      vtype: string

- name: Install jitsi-meet
  ansible.builtin.apt:
    pkg: "{{ jitsi_meet_packages }}"
    install_recommends: no
    state: present
    cache_valid_time: 3600

- name: Copy videobridge configs
  ansible.builtin.template:
    src: "videobridge/{{ item }}.j2"
    dest: "/etc/jitsi/videobridge/{{ item }}"
    owner: jvb
    group: jitsi
    mode: 0640
  loop:
    - jvb.conf
    - logging.properties
    - sip-communicator.properties
  notify: Restart jitsi-videobridge2

- name: Copy Jicofo log.properties
  ansible.builtin.copy:
    content: "{{ jitsi_meet_jicofo_logging_properties }}"
    dest: /etc/jitsi/jicofo/logging.properties
    owner: jicofo
    group: jitsi
    mode: 0640
  notify: Restart jicofo

- name: Copy jitsi meet config
  ansible.builtin.template:
    mode: 0644
    src: meet-config.js.j2
    dest: "/etc/jitsi/meet/{{ jitsi_meet_server_name }}-config.js"

- name: Enable jitsi-videobridge2
  ansible.builtin.service:
    name: jitsi-videobridge2
    enabled: yes

- name: Enable jicofo
  ansible.builtin.service:
    name: jicofo
    enabled: yes

- name: Create systemd override directories
  ansible.builtin.file:
    group: root
    mode: "0755"
    owner: root
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
  loop:
    - jicofo
    - jitsi-videobridge2

- name: Install systemd overrides
  ansible.builtin.copy:
    content: |
      [Unit]
      After=prosody.service
      PartOf=prosody.service

      [Service]
      # Check if prosody is up and running, as both jicofo and jitsi-videobridge2 require it.
      ExecStartPre=/bin/bash -c 'until /usr/bin/nc -w 2 -z 127.0.0.1 5222; do sleep 2; done'
    dest: "/etc/systemd/system/{{ item }}.service.d/override.conf"
    group: root
    mode: "0644"
    owner: root
  loop:
    - jicofo
    - jitsi-videobridge2
  notify:
    - Reload systemd
    - Restart jicofo
    - Restart jitsi-videobridge2
  # Don't install systemd overrides if tests are done via molecule
  when: not (is_molecule_test | default(false) | bool)

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
