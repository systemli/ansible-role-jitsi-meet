---
- name: Set debconf options for jitsi-meet
  ansible.builtin.debconf:
    name: "{{ item.name }}"
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: "{{ item.vtype }}"
  loop:
    - name: jitsi-videobridge2
      question: jitsi-videobridge/jvb-hostname
      value: "{{ jitsi_meet_server_name }}"
      vtype: string
    - name: jitsi-meet-web-config
      question: jitsi-meet/cert-choice
      value: "{{ jitsi_meet_cert_choice }}"
      vtype: string
    - name: jitsi-meet-web-config
      question: jitsi-meet/cert-path-crt
      value: "{{ jitsi_meet_ssl_cert_path }}"
      vtype: string
    - name: jitsi-meet-web-config
      question: jitsi-meet/cert-path-key
      value: "{{ jitsi_meet_ssl_key_path }}"
      vtype: string
    - name: jitsi-meet-prosody
      question: jitsi-meet-prosody/turn-secret
      value: "{{ jitsi_meet_turn_secret }}"
      vtype: string

- name: Install jitsi-meet
  ansible.builtin.apt:
    pkg: "{{ jitsi_meet_packages }}"
    install_recommends: no
    state: present
    cache_valid_time: 3600

- name: Copy videobridge configs
  ansible.builtin.template:
    src: "videobridge/{{ item }}.j2"
    dest: "/etc/jitsi/videobridge/{{ item }}"
    owner: jvb
    group: jitsi
    mode: 0640
  loop:
    - jvb.conf
  notify: Restart jitsi-videobridge2

- name: Copy jitsi meet config
  ansible.builtin.template:
    mode: "0644"
    src: "{{ item }}"
    dest: "/etc/jitsi/meet/{{ jitsi_meet_server_name }}-{{ item }}"
  loop:
    - config.js.j2
    - interface_config.js.j2

- name: Deploy systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0444"
    owner: root
    group: root
  loop:
    - jicofo.service
    - jitsi-videobridge2.service
  notify:
    - Reload systemd
    - Restart jitsi-videobridge2
    - Restart jicofo 

- name: Enable jitsi-videobridge2
  ansible.builtin.service:
    name: jitsi-videobridge2
    enabled: yes

- name: Enable jicofo
  ansible.builtin.service:
    name: jicofo
    enabled: yes

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
