---
name: Auto Label

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  auto_label:
    name: Auto Label
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Label pull request
        uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
