---
galaxy_info:
  role_name: jitsi_meet
  author: systemli
  description: Install and maintain jitsi-meet. Contains tests for Molecule.
  company: systemli.org
  license: GPLv3
  min_ansible_version: "2.14"
  galaxy_tags:
    - networking
    - jitsi
    - jitsimeet
  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
dependencies:
  - role: systemli.apt_repositories
    vars:
      apt_repositories:
        - preset: prosody
        - preset: jitsi
          packages: "{{ jitsi_meet_packages }}"
