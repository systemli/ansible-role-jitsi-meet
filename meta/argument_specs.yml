---
argument_specs:
  main:
    short_description: Install and configure Jitsi Meet with nginx and prosody
    description:
      - Installs Jitsi Meet (including Jicofo and Videobridge) with nginx as web server and prosody as XMPP server on Debian.
    options:
      jitsi_meet_dependencies:
        type: list
        elements: str
        default:
          - apt-utils
          - lua5.2
          - lua-unbound
          - netcat-openbsd
      jitsi_meet_packages:
        type: list
        elements: str
        default:
          - jitsi-meet
      jitsi_meet_server_name:
        type: str
        default: meet.example.com
      jitsi_meet_videobridge_port:
        type: int
        default: 5347
      jitsi_meet_jicofo_user:
        type: str
        default: focus
      jitsi_meet_turn_tls_listening_port:
        type: int
        default: 4446
      jitsi_meet_ssl_cert_path:
        type: str
        default: /etc/ssl/certs/ssl-cert-snakeoil.pem
      jitsi_meet_ssl_key_path:
        type: str
        default: /etc/ssl/private/ssl-cert-snakeoil.key
      jitsi_meet_cert_choice:
        type: str
        default: Generate a new self-signed certificate (You will later get a chance to obtain a Let's encrypt certificate)
      jitsi_meet_config_default_language:
        type: str
        default: en
      jitsi_meet_config_disable_third_party_requests:
        type: str
        default: 'true'
      jitsi_meet_config_last_n:
        type: str
        default: '-1'
      jitsi_meet_config_p2p_enabled:
        type: str
        default: 'true'
      jitsi_meet_config_layer_suspension:
        type: str
        default: 'true'
      jitsi_meet_config_prejoin_page_enabled:
        type: str
        default: 'false'
      jitsi_meet_config_insecure_room_name_warning:
        type: str
        default: 'true'
      jitsi_meet_config_require_display_name:
        type: str
        default: 'false'
      jitsi_meet_config_resolution:
        type: int
        default: 720
      jitsi_meet_config_constraints:
        type: dict
        description:
          - Video constraints for meet-config.js. Defaults to the resolution given in C(jitsi_meet_config_resolution).
        default:
          video:
            height:
              ideal: '{{ jitsi_meet_config_resolution }}'
              max: 720
              min: 240
      jitsi_meet_config_start_audio_only:
        type: str
        default: 'false'
      jitsi_meet_config_stun_servers:
        type: list
        elements: str
        description:
          - STUN servers as C(host:port). The first entry is also used for the TURN settings in prosody.
        default:
          - meet-jit-si-turnrelay.jitsi.net:443
      jitsi_meet_config_analytics_disabled:
        type: str
        default: 'true'
      jitsi_meet_title:
        type: str
        default: Jitsi Meet
      jitsi_meet_description:
        type: str
        default: Join a WebRTC video conference powered by the Jitsi Videobridge
      jitsi_meet_interface_app_name:
        type: str
        default: '{{ jitsi_meet_title }}'
      jitsi_meet_interface_brand_watermark_link:
        type: str
        default: ''
      jitsi_meet_interface_default_background:
        type: str
        default: '#474747'
      jitsi_meet_interface_default_local_display_name:
        type: str
        default: me
      jitsi_meet_interface_default_logo_url:
        type: str
        default: images/watermark.svg
      jitsi_meet_interface_default_remote_display_name:
        type: str
        default: Fellow Jitster
      jitsi_meet_interface_default_welcome_page_logo_url:
        type: str
        default: images/watermark.svg
      jitsi_meet_interface_provider_name:
        type: str
        default: Jitsi
      jitsi_meet_interface_display_welcome_footer:
        type: str
        default: 'true'
      jitsi_meet_interface_jitsi_watermark_link:
        type: str
        default: https://jitsi.org
      jitsi_meet_interface_mobile_app_promo:
        type: str
        default: 'true'
      jitsi_meet_interface_mobile_download_link_android:
        type: str
        default: https://play.google.com/store/apps/details?id=org.jitsi.meet
      jitsi_meet_interface_mobile_download_link_f_droid:
        type: str
        default: https://f-droid.org/en/packages/org.jitsi.meet/
      jitsi_meet_interface_mobile_download_link_ios:
        type: str
        default: https://itunes.apple.com/us/app/jitsi-meet/id1165103905
      jitsi_meet_interface_native_app_name:
        type: str
        default: Jitsi Meet
      jitsi_meet_title_image:
        type: str
        default: images/jitsilogo.png?v=1
      jitsi_meet_title_favicon:
        type: str
        default: images/favicon.ico?v=1
      jitsi_meet_debsums_ignore_custom_assets:
        type: bool
        default: false
      jitsi_meet_logrotate_retained_days:
        type: int
        default: 7
      jitsi_meet_loglevel:
        type: str
        default: WARNING
      jitsi_meet_videobridge_loglevel:
        type: str
        default: '{{ jitsi_meet_loglevel }}'
      jitsi_meet_jicofo_loglevel:
        type: str
        default: '{{ jitsi_meet_loglevel }}'
      jitsi_meet_jicofo_logging_properties:
        type: str
        default: |2

          handlers= java.util.logging.ConsoleHandler

          # Handlers with XMPP debug enabled:
          #handlers= java.util.logging.ConsoleHandler, org.jitsi.impl.protocol.xmpp.log.XmppPacketsFileHandler

          # Handlers with syslog enabled:
          #handlers= java.util.logging.ConsoleHandler, com.agafua.syslog.SyslogHandler
          #handlers= java.util.logging.ConsoleHandler, io.sentry.jul.SentryHandler

          java.util.logging.ConsoleHandler.level = {{ jitsi_meet_jicofo_loglevel }}
          java.util.logging.ConsoleHandler.formatter = org.jitsi.utils.logging2.JitsiLogFormatter
          java.util.logging.ConsoleHandler.filter = org.jitsi.impl.protocol.xmpp.log.ExcludeXmppPackets

          org.jitsi.utils.logging2.JitsiLogFormatter.programname=Jicofo
          .level=INFO

          # To enable XMPP packets logging add XmppPacketsFileHandler to the handlers property
          org.jitsi.impl.protocol.xmpp.log.PacketDebugger.level=ALL
          org.jitsi.impl.protocol.xmpp.log.XmppPacketsFileHandler.pattern=/var/log/jitsi/jicofo-xmpp.log
          org.jitsi.impl.protocol.xmpp.log.XmppPacketsFileHandler.append=true
          org.jitsi.impl.protocol.xmpp.log.XmppPacketsFileHandler.limit=200000000
          org.jitsi.impl.protocol.xmpp.log.XmppPacketsFileHandler.count=3

          # Syslog (uncomment handler to use)
          com.agafua.syslog.SyslogHandler.transport = udp
          com.agafua.syslog.SyslogHandler.facility = local0
          com.agafua.syslog.SyslogHandler.port = 514
          com.agafua.syslog.SyslogHandler.hostname = localhost
          com.agafua.syslog.SyslogHandler.formatter = org.jitsi.utils.logging2.JitsiLogFormatter
          com.agafua.syslog.SyslogHandler.escapeNewlines = false
          com.agafua.syslog.SyslogHandler.filter = org.jitsi.impl.protocol.xmpp.log.ExcludeXmppPackets

          # Sentry (uncomment handler to use)
          io.sentry.jul.SentryHandler.level=WARNING

          # uncomment to see how Jicofo talks to the JVB
          #org.jitsi.impl.protocol.xmpp.colibri.level=ALL
      jitsi_meet_nginx_access_log:
        type: str
        description:
          - Disable nginx access log per default
        default: 'off'
      jitsi_meet_nginx_error_log:
        type: str
        default: /var/log/nginx/error.log
      jitsi_meet_nginx_ssl_preset:
        type: str
        choices:
          - modern
          - intermediate
          - old
        default: intermediate
      jitsi_meet_nginx_ssl_presets:
        type: dict
        description:
          - Mapping of preset name to a dict with C(protocols), C(ciphers) and C(prefer_server_ciphers).
        default:
          modern:
            protocols: TLSv1.3
            ciphers: ''
            prefer_server_ciphers: 'off'
          intermediate:
            protocols: TLSv1.2 TLSv1.3
            ciphers: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
            prefer_server_ciphers: 'off'
          old:
            protocols: TLSv1 TLSv1.1 TLSv1.2 TLSv1.3
            ciphers: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA
            prefer_server_ciphers: 'on'
      jitsi_meet_nginx_ssl_protocols:
        type: str
        description:
          - Defaults to the protocols of the selected preset.
        default: '{{ jitsi_meet_nginx_ssl_presets[jitsi_meet_nginx_ssl_preset][''protocols''] }}'
      jitsi_meet_nginx_ssl_prefer_server_ciphers:
        type: str
        description:
          - Defaults to the value of the selected preset.
        default: '{{ jitsi_meet_nginx_ssl_presets[jitsi_meet_nginx_ssl_preset][''prefer_server_ciphers''] }}'
      jitsi_meet_nginx_ssl_ciphers:
        type: str
        description:
          - Defaults to the ciphers of the selected preset.
        default: '{{ jitsi_meet_nginx_ssl_presets[jitsi_meet_nginx_ssl_preset][''ciphers''] }}'
      jitsi_meet_nginx_ssl_dhparam:
        type: str
        default: /etc/nginx/dhparam
      jitsi_meet_nginx_listen_https_enabled:
        type: bool
        description:
          - If you are behind a proxy that does SSL termination set this to false
        default: true
      jitsi_meet_behind_nat_enabled:
        type: bool
        description:
          - Set both C(jitsi_meet_nat_local_ip) and C(jitsi_meet_nat_public_ip) if you enable NAT.
        default: false
      jitsi_meet_nat_local_ip:
        type: str
        description:
          - Local IP of the host, only relevant if C(jitsi_meet_behind_nat_enabled) is true.
        default: '{{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}'
      jitsi_meet_base_secret:
        type: str
        required: true
        description:
          - Secret from which passwords for the internally used accounts (Videobridge, TURN, MUC nickname) are derived.
      jitsi_meet_nat_public_ip:
        type: str
        description:
          - Public IP of the host, only relevant if C(jitsi_meet_behind_nat_enabled) is true.
      jitsi_meet_config_deployment_urls:
        type: list
        elements: dict
        description:
          - Entries for C(deploymentInfo) deployment URLs in meet-config.js. Optional.
      jitsi_meet_watermark_file:
        type: path
        description:
          - Local file used as watermark logo. Optional.
      jitsi_meet_logo_file:
        type: path
        description:
          - Local file used as logo. Optional.
      jitsi_meet_favicon_file:
        type: path
        description:
          - Local file used as favicon. Optional.
